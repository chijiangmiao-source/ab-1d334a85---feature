<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>声学应急控制器规程等价性复核</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <h1>声学应急控制器 · 规程等价性复核</h1>
  <p class="subtitle">任意精度有理数判定：所有有限命令串的最终安全态概率是否一致（不枚举长度上限、不使用浮点数）</p>
</header>

<main>
  <section class="editor" id="editor-A" data-side="A">
    <h2>现网规程 A</h2>
    <div class="meta-row">
      <label>状态数 <input type="number" min="1" step="1" id="n-A" value="2" /></label>
      <label>安全状态（逗号分隔编号，自 0 起）
        <input type="text" id="safe-A" value="1" />
      </label>
    </div>
    <div class="field">
      <label>初始状态分布（分数，空格/逗号分隔，如 <code>1/2 1/2</code>）</label>
      <input type="text" id="initial-A" value="1 0" />
    </div>
    <div class="field">
      <label>ASCII 命令（单个字符，逗号分隔）</label>
      <input type="text" id="symbols-A" value="x" />
    </div>
    <div id="commands-A" class="commands"></div>
  </section>

  <section class="editor" id="editor-B" data-side="B">
    <h2>候选规程 B</h2>
    <div class="meta-row">
      <label>状态数 <input type="number" min="1" step="1" id="n-B" value="2" /></label>
      <label>安全状态（逗号分隔编号，自 0 起）
        <input type="text" id="safe-B" value="1" />
      </label>
    </div>
    <div class="field">
      <label>初始状态分布（分数，空格/逗号分隔，如 <code>1/2 1/2</code>）</label>
      <input type="text" id="initial-B" value="1 0" />
    </div>
    <div class="field">
      <label>ASCII 命令（单个字符，逗号分隔）</label>
      <input type="text" id="symbols-B" value="x" />
    </div>
    <div id="commands-B" class="commands"></div>
  </section>

  <section class="actions">
    <button id="btn-review" type="button">提交复核</button>
    <button id="btn-example" type="button" class="secondary">载入：长度2反例样例</button>
    <button id="btn-equivalent-example" type="button" class="secondary">载入：等价样例</button>
  </section>

  <section class="cruise-input" id="cruise-input">
    <h2>巡航周期长期安全占比审计</h2>
    <p class="hint">
      普通有限命令串复核完成后，可填写一个由两侧共同 ASCII 命令构成、长度不超过 6 的巡航周期
      （本审计要求每侧状态数不超过 8）。服务端把每轮周期压缩为精确随机矩阵，区分暂态质量与全部闭类及其周期，
      求无限重复下每个命令相位的最终周期性安全概率，并按两侧共同重复周期逐相位比较——全程精确有理数，
      不做固定轮数模拟或浮点近似。
    </p>
    <div class="cruise-row">
      <label>巡航周期（将被无限重复的命令串，1–6 个字符）
        <input type="text" id="cruise-cycle" maxlength="6" placeholder="例如 xxy" data-path="cycle" autocomplete="off" />
      </label>
      <button id="btn-cruise" type="button">巡航审计</button>
    </div>
  </section>

  <section id="errors" class="errors" hidden></section>
  <section id="result" class="result" hidden></section>
  <section id="cruise-result" class="result" hidden></section>
</main>

<footer>声学规程前后端 · Docker / Compose 发布</footer>
<script src="/static/app.js"></script>
</body>
</html>
